name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions: {}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    name: Web
    permissions:
      contents: read
    uses: openbunny/.github/.github/workflows/reusable-check.yml@2383033519e5dd89bfd4e832659933a145e7acde # v0.2.0
    with:
      runner: ubuntu-24.04
      tools: node just
      recipe: ci-web
      timeout-minutes: 15

  swift:
    name: Swift
    permissions:
      contents: read
    uses: openbunny/.github/.github/workflows/reusable-check.yml@2383033519e5dd89bfd4e832659933a145e7acde # v0.2.0
    with:
      runner: macos-26
      xcode: '26.0'
      tools: node just xcodegen
      recipe: ci-swift

  audit:
    name: npm audit
    permissions:
      contents: read
    uses: openbunny/.github/.github/workflows/reusable-check.yml@2383033519e5dd89bfd4e832659933a145e7acde # v0.2.0
    with:
      runner: ubuntu-24.04
      tools: node just
      recipe: ci-audit
      timeout-minutes: 15

  actions:
    name: Actions
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          cache: false
          install_args: actionlint pinact just
      - name: actionlint and pinact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: just actions-lint pinact-check

  reuse:
    name: REUSE
    permissions:
      contents: read
    uses: openbunny/.github/.github/workflows/reusable-reuse.yml@2383033519e5dd89bfd4e832659933a145e7acde # v0.2.0

  gitleaks:
    name: Gitleaks
    permissions:
      contents: read
    uses: openbunny/.github/.github/workflows/reusable-gitleaks.yml@2383033519e5dd89bfd4e832659933a145e7acde # v0.2.0
    with:
      version: 8.30.1

  zizmor:
    name: Zizmor
    permissions:
      contents: read
    uses: openbunny/.github/.github/workflows/reusable-zizmor.yml@2383033519e5dd89bfd4e832659933a145e7acde # v0.2.0
    with:
      version: 1.30.1

  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: openbunny/.github/.github/workflows/reusable-dco.yml@2383033519e5dd89bfd4e832659933a145e7acde # v0.2.0

  gate:
    name: Gate
    if: ${{ always() }}
    needs: [web, swift, audit, actions, reuse, gitleaks, zizmor]
    permissions: {}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: every gate job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<<"$NEEDS"
