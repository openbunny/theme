name: scorecard
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions: {}
jobs:
  scorecard:
    name: Scorecard
    # scorecard-action cannot read a private repository with GITHUB_TOKEN; the job runs once the repository is public.
    if: github.event.repository.private == false
    permissions:
      contents: read
      id-token: write # mints the OIDC token scorecard-action uses to sign published results
    uses: openbunny/.github/.github/workflows/reusable-scorecard.yml@2050692900f7dcd883e416ebee37a1b97b119203 # v0.3.0
    with:
      publish: true
