version = 1
SPDX-PackageName = "theme"
SPDX-PackageSupplier = "OpenBunny"
SPDX-PackageDownloadLocation = "https://github.com/openbunny/theme"

[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 OpenBunny"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [
  "Sources/OpenBunnyTheme/Resources/CourierPrime-*.ttf",
  "Sources/OpenBunnyTheme/Resources/OFL-CourierPrime.txt",
  "packages/web/fonts/courier-prime-*.woff2",
  "packages/web/fonts/OFL-CourierPrime.txt",
]
precedence = "closest"
SPDX-FileCopyrightText = "2015 The Courier Prime Project Authors (https://github.com/quoteunquoteapps/CourierPrime)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = [
  "Sources/OpenBunnyTheme/Resources/JetBrainsMono-*.ttf",
  "Sources/OpenBunnyTheme/Resources/OFL-JetBrainsMono.txt",
  "packages/web/fonts/jetbrains-mono-*.woff2",
  "packages/web/fonts/OFL-JetBrainsMono.txt",
]
precedence = "closest"
SPDX-FileCopyrightText = "2020 The JetBrains Mono Project Authors (https://github.com/JetBrains/JetBrainsMono)"
SPDX-License-Identifier = "OFL-1.1"
